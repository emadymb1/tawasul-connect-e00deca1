name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing platform folders
        run: |
          flutter create . --platforms=android \
            --org fi.fiksutilitoimisto --project-name tawasul

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Generate native splash
        run: dart run flutter_native_splash:create || true

      - name: Localised app name (Android)
        run: |
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-ar
          cp native_names/android/values/strings.xml android/app/src/main/res/values/strings.xml
          cp native_names/android/values-ar/strings.xml android/app/src/main/res/values-ar/strings.xml

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=TAWASUL_BASE_URL="https://se.fiksutilitoimisto.fi/modules/Rest%20API/api.php/v2"

      - uses: actions/upload-artifact@v4
        with:
          name: tawasul-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
